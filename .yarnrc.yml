approvedGitRepositories:
  - "**"

compressionLevel: mixed

enableGlobalCache: false

enableScripts: true

enableTelemetry: false

logFilters:
  - code: YN0002
    level: discard
  - code: YN0060
    level: discard
  - code: YN0006
    level: discard
  - code: YN0076
    level: discard
  - code: YN0086
    level: discard

nodeLinker: node-modules

# Desktop/image native builds are not needed on EAS mobile builders and can
# fail the install (sharp source compile, electron download).
dependenciesMeta:
  sharp:
    built: false
  electron:
    built: false
  electron-builder:
    built: false
  "@electron/rebuild":
    built: false

# face_detection is intentionally Metro-stubbed; seedrandom is provided by the app.
packageExtensions:
  "@tensorflow-models/face-detection@*":
    peerDependenciesMeta:
      "@mediapipe/face_detection":
        optional: true
  "@tensorflow/tfjs-data@*":
    peerDependenciesMeta:
      seedrandom:
        optional: true

yarnPath: .yarn/releases/yarn-4.17.0.cjs
