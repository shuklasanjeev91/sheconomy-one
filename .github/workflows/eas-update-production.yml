# Publish OTA (EAS Update) to the production channel when main advances.
# Requires repo secret EXPO_TOKEN from https://expo.dev/settings/access-tokens
name: EAS Update (production)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: eas-update-production
  cancel-in-progress: true

jobs:
  update:
    name: Publish production OTA
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      EXPO_PUBLIC_WEB_APP_URL: https://sheconomy.in
      ONE_SERVER_URL: https://sheconomy.in
      EXPO_PUBLIC_APP_ENV: production
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Add repository secret EXPO_TOKEN (Expo access token)."
            echo "https://docs.expo.dev/eas-update/github-actions/"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: yarn

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: yarn install --immutable
        env:
          YARN_ENABLE_GLOBAL_CACHE: 'false'
          YARN_NODE_LINKER: node-modules

      - name: Publish EAS Update (production)
        run: |
          MESSAGE=$(printf '%s' "${{ github.event.head_commit.message }}" | head -n 1 | cut -c1-200)
          if [ -z "$MESSAGE" ]; then
            MESSAGE="OTA from ${GITHUB_SHA::7}"
          fi
          eas update --channel production --message "$MESSAGE" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_ONESIGNAL_APP_ID: ${{ secrets.EXPO_PUBLIC_ONESIGNAL_APP_ID }}
