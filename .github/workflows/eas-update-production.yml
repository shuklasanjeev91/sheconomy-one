# Publish OTA to production on every main push — this is what makes JS/UI
# changes live on installed App Store / Play Store apps within seconds
# (force-quit + reopen, or resume after cooldown). Native binary changes still
# need EAS Build + Submit (see eas-build-submit-production.yml — manual only).
#
# Requires repo secret EXPO_TOKEN: https://expo.dev/settings/access-tokens
name: EAS Update (production)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: eas-update-production
  cancel-in-progress: true

jobs:
  update:
    name: Publish production OTA
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      EXPO_PUBLIC_WEB_APP_URL: https://sheconomy.in
      ONE_SERVER_URL: https://sheconomy.in
      EXPO_PUBLIC_APP_ENV: production
      # Public client defaults (same as eas.json production). Secrets override when set.
      EXPO_PUBLIC_SUPABASE_URL_DEFAULT: https://zsaqrrzwygzwrlzgymxk.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY_DEFAULT: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpzYXFycnp3eWd6d3Jsemd5bXhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTEyNTYwMzMsImV4cCI6MjA2NjgzMjAzM30.cFeln0b7EtzPaNmuGTCr3sDn_nU_8uNjaIYL9ER1_U0
      EXPO_PUBLIC_ONESIGNAL_APP_ID_DEFAULT: d43662df-5e0b-46eb-9ee1-258220fc7e4b
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Add repository secret EXPO_TOKEN (Expo access token)."
            echo "https://docs.expo.dev/eas-update/github-actions/"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: yarn

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 16.28.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: yarn install --immutable
        env:
          YARN_ENABLE_GLOBAL_CACHE: 'false'
          YARN_NODE_LINKER: node-modules

      - name: Resolve public Expo env
        id: expo_env
        run: |
          SUPABASE_URL='${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}'
          SUPABASE_ANON='${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}'
          ONESIGNAL='${{ secrets.EXPO_PUBLIC_ONESIGNAL_APP_ID }}'
          if [ -z "$SUPABASE_URL" ]; then SUPABASE_URL="$EXPO_PUBLIC_SUPABASE_URL_DEFAULT"; fi
          if [ -z "$SUPABASE_ANON" ]; then SUPABASE_ANON="$EXPO_PUBLIC_SUPABASE_ANON_KEY_DEFAULT"; fi
          if [ -z "$ONESIGNAL" ]; then ONESIGNAL="$EXPO_PUBLIC_ONESIGNAL_APP_ID_DEFAULT"; fi
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=$SUPABASE_URL"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$SUPABASE_ANON"
            echo "EXPO_PUBLIC_ONESIGNAL_APP_ID=$ONESIGNAL"
          } >> "$GITHUB_ENV"
          echo "Resolved public Expo env for OTA bundle (secrets override defaults when set)."

      - name: Publish EAS Update (production)
        id: publish
        run: |
          MESSAGE=$(printf '%s' "${{ github.event.head_commit.message }}" | head -n 1 | cut -c1-200)
          if [ -z "$MESSAGE" ]; then
            MESSAGE="OTA from ${GITHUB_SHA::7}"
          fi
          echo "PUBLISH_MESSAGE<<EOF" >> "$GITHUB_ENV"
          echo "$MESSAGE" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
          # Store binaries only install an exact runtime match:
          # Play 6.1.0 (versionCode 204) on English-locale phones reports 6.0.8: Play's
          #   config.en split overrides expo_runtime_version. Android only — iOS 6.0.8
          #   is the old App Store 6.0.11 binary and must keep the 6.0.x branch code.
          # Some iOS clients report runtime 6.0.11 (app version) — publish that too.
          # Last Play-approved FGS-stripped Android → 6.0.7.
          EAS_UPDATE_RUNTIME_VERSION=6.0.8 eas update --channel production --platform android --message "$MESSAGE (runtime 6.0.8 android)" --non-interactive
          EAS_UPDATE_RUNTIME_VERSION=6.0.11 eas update --channel production --message "$MESSAGE (runtime 6.0.11)" --non-interactive
          EAS_UPDATE_RUNTIME_VERSION=6.0.7 eas update --channel production --message "$MESSAGE (runtime 6.0.7)" --non-interactive
          # app.json runtime last so the verify step sees it as the newest group.
          eas update --channel production --message "$MESSAGE" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_WEB_APP_URL: https://sheconomy.in
          ONE_SERVER_URL: https://sheconomy.in
          EXPO_PUBLIC_APP_ENV: production

      - name: Verify latest production update
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          RUNTIME=$(node -p "require('./app.json').expo.runtimeVersion")
          RUNTIME_RE=$(printf '%s' "$RUNTIME" | sed 's/\./\\./g')
          OUTPUT=$(eas update:list --branch production --limit 1 --non-interactive 2>&1)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -Eqi "Runtime Version[[:space:]]*${RUNTIME_RE}" \
            || { echo "Expected runtimeVersion $RUNTIME on latest production update."; exit 1; }
          echo "$OUTPUT" | grep -Eqi 'Platforms[[:space:]]*.*android' \
            || { echo "Expected android platform on latest update."; exit 1; }
          echo "$OUTPUT" | grep -Eqi 'Platforms[[:space:]]*.*ios' \
            || { echo "Expected ios platform on latest update."; exit 1; }
          # Newest group should reference this commit SHA or the publish message.
          if ! echo "$OUTPUT" | grep -Fq "$SHORT_SHA" && ! echo "$OUTPUT" | grep -Fq "$PUBLISH_MESSAGE"; then
            echo "Latest update does not mention SHA $SHORT_SHA or publish message."
            echo "Publish message was: $PUBLISH_MESSAGE"
            exit 1
          fi
          echo "Verified latest production OTA (runtime $RUNTIME, android+ios). 6.0.8 android, 6.0.11 and 6.0.7 are published in the same job."
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
