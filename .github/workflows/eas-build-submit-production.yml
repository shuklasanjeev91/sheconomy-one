# Manual store binary build + submit. JS/UI goes live via OTA
# (eas-update-production.yml on every main push). Run this workflow only when
# native changes need a new App Store / Play binary.
#
# Requires EXPO_TOKEN + Apple/Google credentials on EAS.
# Android also needs Google Play Android Developer API enabled on the GCP project
# linked to the Play service account.
name: EAS Build + Submit (production)

on:
  workflow_dispatch:

concurrency:
  group: eas-build-submit-production
  # Do not cancel — store builds are expensive and long-running.
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: Build and submit iOS + Android
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Add repository secret EXPO_TOKEN (Expo access token)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: yarn

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 16.28.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: yarn install --immutable
        env:
          YARN_ENABLE_GLOBAL_CACHE: 'false'
          YARN_NODE_LINKER: node-modules

      - name: Build and auto-submit store binaries
        run: |
          eas build --platform all --profile production --auto-submit --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_WEB_APP_URL: https://sheconomy.in
          ONE_SERVER_URL: https://sheconomy.in
          EXPO_PUBLIC_APP_ENV: production
