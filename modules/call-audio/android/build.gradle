apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'com.sheconomy.callaudio'
version = '1.0.0'

android {
  namespace "com.sheconomy.callaudio"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

repositories {
  mavenCentral()
  google()
  maven { url 'https://jitpack.io' }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation project(':react-native-webrtc')
  // Twilio AudioSwitch fork with audio-focus / audio-mode setters.
  implementation 'com.github.davidliu:audioswitch:89582c47c9a04c62f90aa5e57251af4800a62c9a'
}
